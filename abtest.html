<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廣告文案 A/B Test 瀏覽率預測推算器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
    }
    .gradient-border-winner {
      box-shadow: 0 0 20px -2px rgba(16, 185, 129, 0.25);
      border-color: #10b981;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- 頂部標題區 -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-full text-xs font-semibold mb-2">
          <i class="ph-bold ph-chart-polar"></i>
          文案語意與受眾心理演算法模型
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
          廣告文案 A/B 測試預測評估器
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          免自行手動虛構數據；系統自動從「吸睛鉤子、痛點共鳴、認知流暢度、好奇缺口、行動力」推算勝率。
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <button onclick="loadPreset('meta')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg text-slate-300 transition flex items-center gap-1.5">
          <i class="ph ph-sparkle"></i> 載入範例文案
        </button>
        <button onclick="clearAll()" class="px-3 py-1.5 bg-slate-800 hover:bg-red-950 text-xs rounded-lg text-slate-400 hover:text-red-300 transition">
          清空重填
        </button>
      </div>
    </header>

    <!-- 廣告情境配置 -->
    <section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">
          <i class="ph-bold ph-device-mobile-camera text-indigo-400"></i> 投放目標平台
        </label>
        <select id="platformSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
          <option value="meta_feed">Meta 資訊流 (FB / IG Post)</option>
          <option value="ig_story">IG 限時動態 / Reels 短影音</option>
          <option value="threads">Threads 脆文廣告</option>
          <option value="google_search">Google 關鍵字搜尋廣告</option>
          <option value="line_voom">LINE 行銷訊息 / VOOM</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">
          <i class="ph-bold ph-users text-indigo-400"></i> 目標受眾屬性 (TA)
        </label>
        <select id="audienceSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
          <option value="young">年輕族群 / 大學生 / 20-25 歲小資</option>
          <option value="career">忙碌上班族 / 職場白領</option>
          <option value="parent">精打細算父母 / 家庭採購者</option>
          <option value="tech">專業工作者 / 開發者 / 科技受眾</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">
          <i class="ph-bold ph-target text-indigo-400"></i> 廣告行銷主目標
        </label>
        <select id="goalSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
          <option value="ctr">最大化點擊/瀏覽率 (High CTR)</option>
          <option value="lead">名單註冊/免費領取 (Lead Magnet)</option>
          <option value="purchase">直接購買轉換 (Direct Purchase)</option>
        </select>
      </div>
    </section>

    <!-- 文案輸入區塊 (並排) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- 文案 A -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-sm relative group">
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-full text-xs font-bold tracking-wider">
              對照組 • 文案 A
            </span>
            <span id="charCountA" class="text-xs text-slate-500">0 字</span>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">主標題 / 首句 Hook</label>
            <input type="text" id="titleA" placeholder="例如：還在手動算廣告數據到半夜？" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" oninput="runAnalysis()">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">正文內容 / 痛點與解方描述</label>
            <textarea id="bodyA" rows="5" placeholder="輸入文案詳細描述、產品特色與受眾切身場景..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition resize-none" oninput="runAnalysis()"></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">行動呼籲 (CTA 按鈕字樣)</label>
            <input type="text" id="ctaA" placeholder="例如：立即看解析 / 免費試算" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition" oninput="runAnalysis()">
          </div>
        </div>
      </div>

      <!-- 文案 B -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-sm relative group">
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full text-xs font-bold tracking-wider">
              實驗組 • 文案 B
            </span>
            <span id="charCountB" class="text-xs text-slate-500">0 字</span>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">主標題 / 首句 Hook</label>
            <input type="text" id="titleB" placeholder="輸入要比對測試的文案 B 標題..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition" oninput="runAnalysis()">
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">正文內容 / 痛點與解方描述</label>
            <textarea id="bodyB" rows="5" placeholder="輸入文案 B 的正文內文..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition resize-none" oninput="runAnalysis()"></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">行動呼籲 (CTA 按鈕字樣)</label>
            <input type="text" id="ctaB" placeholder="例如：領取秘訣" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition" oninput="runAnalysis()">
          </div>
        </div>
      </div>
    </div>

    <!-- 運算按鈕 -->
    <div class="text-center">
      <button onclick="runAnalysis(true)" class="px-8 py-3 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:to-pink-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 transition transform active:scale-95 inline-flex items-center gap-2 text-base">
        <i class="ph-bold ph-lightning"></i> 立即執行多維度演算法推算
      </button>
    </div>

    <!-- 推算分析結果展示區 (動態更新) -->
    <div id="resultsCard" class="hidden space-y-6">
      
      <!-- 勝出預測 Hero 區塊 -->
      <div id="winnerBanner" class="p-6 rounded-2xl border transition-all duration-300">
        <!-- 內容由 JS 產生 -->
      </div>

      <!-- 6 大維度評分比對矩陣 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
          <i class="ph-bold ph-chart-bar text-indigo-400"></i> 六大受眾心理與傳播維度推算細項
        </h3>
        
        <div id="dimensionsList" class="space-y-4">
          <!-- 維度進度條由 JS 渲染 -->
        </div>
      </div>

      <!-- 具體優化戰術建議 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
          <div class="flex items-center gap-2 text-blue-400 font-bold text-sm mb-3">
            <i class="ph-bold ph-lightbulb"></i> 文案 A 診斷與優勢解析
          </div>
          <ul id="feedbackA" class="space-y-2 text-xs text-slate-300"></ul>
        </div>

        <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5">
          <div class="flex items-center gap-2 text-amber-400 font-bold text-sm mb-3">
            <i class="ph-bold ph-lightbulb"></i> 文案 B 診斷與優勢解析
          </div>
          <ul id="feedbackB" class="space-y-2 text-xs text-slate-300"></ul>
        </div>
      </div>

    </div>

  </div>

  <script>
    // 預設範例文案 (Meta 實戰電商/工具場景)
    const PRESETS = {
      meta: {
        titleA: "想提高廣告點擊率嗎？來試試我們的一站式廣告優化工具！",
        bodyA: "我們提供卓越且全方位的數位行銷解決方案，致力於協助廣大品牌主提升企業價值與獲利能力。功能齊全、操作簡單，業界領先技術保證。",
        ctaA: "立即前往官網了解更多",
        titleB: "「廣告費燒了3萬，點擊率不到0.8%？」3個連資深投手都在犯的致命盲點",
        bodyB: "你是不是也遇過：素材換了又換，ROAS 依然卡在原點？別再瞎猜受眾想看什麼了。這份避坑指南幫你省下 40% 無效花費，看完直接套用在下一檔投放。",
        ctaB: "免費領取完整避坑指南 ➜"
      }
    };

    function loadPreset(key) {
      const data = PRESETS[key];
      document.getElementById('titleA').value = data.titleA;
      document.getElementById('bodyA').value = data.bodyA;
      document.getElementById('ctaA').value = data.ctaA;
      document.getElementById('titleB').value = data.titleB;
      document.getElementById('bodyB').value = data.bodyB;
      document.getElementById('ctaB').value = data.ctaB;
      runAnalysis(true);
    }

    function clearAll() {
      document.getElementById('titleA').value = "";
      document.getElementById('bodyA').value = "";
      document.getElementById('ctaA').value = "";
      document.getElementById('titleB').value = "";
      document.getElementById('bodyB').value = "";
      document.getElementById('ctaB').value = "";
      document.getElementById('resultsCard').classList.add('hidden');
      updateCharCount();
    }

    function updateCharCount() {
      const lenA = (document.getElementById('titleA').value + document.getElementById('bodyA').value).length;
      const lenB = (document.getElementById('titleB').value + document.getElementById('bodyB').value).length;
      document.getElementById('charCountA').textContent = `${lenA} 字`;
      document.getElementById('charCountB').textContent = `${lenB} 字`;
    }

    // 關鍵字字典 (心理學推算特徵)
    const LEXICON = {
      // 認知阻力 / 官腔無感詞彙 (扣分)
      friction: ["全方位", "卓越", "致力於", "領導品牌", "無懈可擊", "頂級享受", "首選", "引領未來", "無微不至", "極致體驗", "本公司", "全新推出"],
      // 切身痛點 / 焦慮與現實共鳴詞 (加分)
      pain: ["卡關", "浪費", "白花", "痛點", "焦慮", "無效", "踩雷", "瞎猜", "沒時間", "卡在", "崩潰", "救星", "避坑", "熬夜", "虧錢"],
      // 強力誘因 / 心理鉤子詞 (加分)
      power: ["免費", "秘訣", "指南", "避坑", "清單", "模板", "公式", "實測", "3個", "10分鐘", "直接套用", "私藏", "真相", "解密"],
      // 具體數據模式
      hasNumbers: /\d+(\%|折|萬|元|倍|個|天|秒|步)/i,
      // 疑問/衝突句型
      hasQuestions: /[？\?]/,
      // 呼喚受眾 (你 / 你們)
      hasYou: /[你您]/
    };

    // 語意演算法單側計分器 (0~100)
    function scoreAdCopy(title, body, cta, platform, audience, goal) {
      const fullText = (title + " " + body).trim();
      if (!fullText) return { total: 0, dims: {} };

      let scores = {
        hook: 50,       // 3秒吸睛度 (Hook Strength)
        pain: 50,       // 痛點與受眾切身度 (Pain Resonance)
        clarity: 65,    // 資訊流暢度 (Cognitive Ease, 扣除官腔)
        curiosity: 50,  // 好奇缺口 (Curiosity Gap)
        cta: 50,        // 點擊阻力 (CTA Friction)
        platformFit: 60 // 平台情境契合度
      };

      let notes = [];

      // 1. Hook 評估
      if (title.length >= 6 && title.length <= 38) scores.hook += 15;
      if (LEXICON.hasQuestions.test(title)) {
        scores.hook += 12;
        notes.push("標題採用反詰/疑問句，有效創造心智停頓點");
      }
      if (LEXICON.hasNumbers.test(title)) {
        scores.hook += 14;
        notes.push("標題帶有精確具體數字/單位，提高可信度與大拇指停留率");
      }
      if (title.includes("「") || title.includes("【") || title.includes("：")) {
        scores.hook += 8;
      }

      // 2. 痛點切身度評估
      const youCount = (fullText.match(LEXICON.hasYou) || []).length;
      if (youCount > 0) {
        scores.pain += 12;
        notes.push("高頻使用第二人稱「你」，將話題聚焦在讀者身上而非自我標榜");
      } else {
        scores.pain -= 10;
        notes.push("缺少第二人稱呼喚，容易淪為品牌單向自說自話");
      }

      let painCount = 0;
      LEXICON.pain.forEach(w => { if (fullText.includes(w)) painCount++; });
      scores.pain += Math.min(painCount * 10, 25);
      if (painCount > 0) notes.push(`命中 ${painCount} 個痛感/現實窘境關鍵詞，切中受眾心理阻礙`);

      // 3. 資訊流暢度 (官腔檢查)
      let frictionCount = 0;
      LEXICON.friction.forEach(w => { if (fullText.includes(w)) frictionCount++; });
      if (frictionCount > 0) {
        scores.clarity -= (frictionCount * 12);
        notes.push(`包含「${frictionCount} 個無感官腔宣傳詞」，受眾大腦容易自動掠過無視`);
      } else {
        scores.clarity += 12;
        notes.push("語句生活化且平易近人，認知阻力低");
      }

      // 4. 好奇缺口 (Curiosity Gap)
      let powerCount = 0;
      LEXICON.power.forEach(w => { if (fullText.includes(w)) powerCount++; });
      scores.curiosity += Math.min(powerCount * 8, 24);
      if (powerCount >= 2) notes.push("包含價值清單/實測/指南等高資訊增益詞彙，觸發點擊動機");

      // 5. CTA 行動呼籲強度
      const ctaText = cta.trim();
      if (!ctaText) {
        scores.cta = 40;
      } else {
        if (ctaText.includes("免費") || ctaText.includes("領取") || ctaText.includes("看") || ctaText.includes("指南") || ctaText.includes("➜") || ctaText.includes("立即")) {
          scores.cta += 25;
          notes.push(`CTA「${ctaText}」具備低門檻獲取感，行動阻力較小`);
        } else if (ctaText.includes("購買") || ctaText.includes("註冊") || ctaText.includes("了解更多")) {
          scores.cta += 5;
          notes.push(`CTA「${ctaText}」較為常規中規中矩，缺乏即時誘因`);
        }
      }

      // 6. 平台適配性
      if (platform === "meta_feed" || platform === "threads") {
        if (fullText.length > 300) scores.platformFit -= 15;
        if (fullText.includes("？") || fullText.includes("！")) scores.platformFit += 10;
      } else if (platform === "google_search") {
        if (title.length <= 30 && LEXICON.hasNumbers.test(title)) scores.platformFit += 18;
      }

      // 權重計分
      const dimKeys = Object.keys(scores);
      dimKeys.forEach(k => {
        scores[k] = Math.max(25, Math.min(98, scores[k]));
      });

      const total = Math.round(
        scores.hook * 0.25 +
        scores.pain * 0.25 +
        scores.clarity * 0.15 +
        scores.curiosity * 0.15 +
        scores.cta * 0.10 +
        scores.platformFit * 0.10
      );

      return { total, dims: scores, notes };
    }

    function runAnalysis(forceOpen = false) {
      updateCharCount();

      const titleA = document.getElementById('titleA').value;
      const bodyA = document.getElementById('bodyA').value;
      const ctaA = document.getElementById('ctaA').value;

      const titleB = document.getElementById('titleB').value;
      const bodyB = document.getElementById('bodyB').value;
      const ctaB = document.getElementById('ctaB').value;

      const platform = document.getElementById('platformSelect').value;
      const audience = document.getElementById('audienceSelect').value;
      const goal = document.getElementById('goalSelect').value;

      if (!titleA && !titleB && !bodyA && !bodyB) {
        if (forceOpen) alert("請先填入至少一組文案進行比較！");
        return;
      }

      const resA = scoreAdCopy(titleA, bodyA, ctaA, platform, audience, goal);
      const resB = scoreAdCopy(titleB, bodyB, ctaB, platform, audience, goal);

      // 顯示結果容器
      const resultsContainer = document.getElementById('resultsCard');
      resultsContainer.classList.remove('hidden');

      // 計算兩者勝率分配
      const sum = resA.total + resB.total || 1;
      const winRateA = Math.round((resA.total / sum) * 100);
      const winRateB = 100 - winRateA;

      const diff = Math.abs(resA.total - resB.total);
      const isWinnerA = resA.total > resB.total;
      const isTie = resA.total === resB.total;

      // 預估相對 CTR 提升
      const estimatedCtrLift = (diff * 0.75 + 4).toFixed(1);

      // 渲染勝出 Banner
      const winnerBanner = document.getElementById('winnerBanner');
      if (isTie) {
        winnerBanner.className = "p-6 rounded-2xl border border-slate-700 bg-slate-900/90 text-center";
        winnerBanner.innerHTML = `
          <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-800 text-slate-300 rounded-full text-xs font-semibold mb-2">勢均力敵 (Tie)</div>
          <h2 class="text-xl font-bold text-white">兩組文案預測效能相近 (A: ${winRateA}% vs B: ${winRateB}%)</h2>
          <p class="text-slate-400 text-xs mt-1">建議針對文案首句進行差異化改造，加入更強烈的反差或更精確的數字。</p>
        `;
      } else {
        const winnerTag = isWinnerA ? "文案 A (對照組)" : "文案 B (實驗組)";
        const winnerColor = isWinnerA ? "emerald" : "amber";
        const winnerPct = isWinnerA ? winRateA : winRateB;

        winnerBanner.className = `p-6 rounded-2xl border ${isWinnerA ? 'border-emerald-500/30 bg-emerald-950/20' : 'border-amber-500/30 bg-amber-950/20'}`;
        winnerBanner.innerHTML = `
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-500/20 border border-emerald-500/30 text-emerald-300 rounded-full text-xs font-bold mb-2">
                <i class="ph-bold ph-trophy"></i> 演算法推算預測勝出
              </div>
              <h2 class="text-2xl font-black text-white flex items-center gap-2">
                推薦優先投放：${winnerTag}
              </h2>
              <p class="text-slate-300 text-sm mt-1">
                根據目標受眾心理模型，勝出版本具有較高的手指停頓率與低認知摩擦，預估可帶來相對點擊率提升：
                <span class="text-emerald-400 font-bold text-base">+${estimatedCtrLift}% CTR</span>
              </p>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 px-6 py-4 rounded-xl text-center min-w-[140px]">
              <div class="text-xs text-slate-400 font-medium">預測勝率佔比</div>
              <div class="text-3xl font-black ${isWinnerA ? 'text-emerald-400' : 'text-amber-400'} mt-0.5">
                ${winnerPct}%
              </div>
              <div class="text-[11px] text-slate-500 mt-0.5">A (${winRateA}%) : B (${winRateB}%)</div>
            </div>
          </div>
        `;
      }

      // 渲染維度細項比較
      const dimLabels = {
        hook: { name: "3秒吸睛度 (Hook Strength)", desc: "首句衝突、標題疑問句與拇指停頓誘因" },
        pain: { name: "受眾痛點切身度 (Pain Resonance)", desc: "呼喚第二人稱「你」與具體窘境描寫" },
        clarity: { name: "認知流暢度 (Cognitive Ease)", desc: "無廢話官腔、語義好讀好消化" },
        curiosity: { name: "好奇心缺口 (Curiosity Gap)", desc: "創造懸念、資訊增益期待感" },
        cta: { name: "行動呼籲阻力 (CTA Friction)", desc: "低門檻獲取感 vs 沉重承諾負擔" },
        platformFit: { name: "投放平台格式契合度", desc: "符合該版位的原生閱讀與滾動習慣" }
      };

      const dimContainer = document.getElementById('dimensionsList');
      dimContainer.innerHTML = Object.keys(dimLabels).map(key => {
        const valA = resA.dims[key] || 0;
        const valB = resB.dims[key] || 0;
        return `
          <div class="bg-slate-950/70 p-4 rounded-xl border border-slate-800/80 space-y-2">
            <div class="flex justify-between items-center text-xs">
              <span class="font-bold text-slate-200">${dimLabels[key].name}</span>
              <span class="text-slate-400 text-[11px]">${dimLabels[key].desc}</span>
            </div>
            
            <div class="grid grid-cols-2 gap-4 items-center pt-1">
              <!-- A -->
              <div>
                <div class="flex justify-between text-[11px] mb-1 font-semibold text-blue-400">
                  <span>文案 A</span>
                  <span>${valA} 分</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2">
                  <div class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: ${valA}%"></div>
                </div>
              </div>
              <!-- B -->
              <div>
                <div class="flex justify-between text-[11px] mb-1 font-semibold text-amber-400">
                  <span>文案 B</span>
                  <span>${valB} 分</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2">
                  <div class="bg-amber-500 h-2 rounded-full transition-all duration-500" style="width: ${valB}%"></div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 渲染優化反饋清單
      const listA = document.getElementById('feedbackA');
      listA.innerHTML = (resA.notes.length ? resA.notes : ["表現均衡，建議可在標題加入具體對比或問題意識。"]).map(n => `
        <li class="flex items-start gap-1.5"><i class="ph-bold ph-check-circle text-blue-400 mt-0.5"></i> <span>${n}</span></li>
      `).join('');

      const listB = document.getElementById('feedbackB');
      listB.innerHTML = (resB.notes.length ? resB.notes : ["表現均衡，建議可在行動呼籲上增加更明確的利益點。"]).map(n => `
        <li class="flex items-start gap-1.5"><i class="ph-bold ph-check-circle text-amber-400 mt-0.5"></i> <span>${n}</span></li>
      `).join('');
    }

    // 預設切換監聽
    document.getElementById('platformSelect').addEventListener('change', () => runAnalysis());
    document.getElementById('audienceSelect').addEventListener('change', () => runAnalysis());
    document.getElementById('goalSelect').addEventListener('change', () => runAnalysis());
  </script>
</body>
</html>
